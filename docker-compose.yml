services:
  # ─────────────────────────────────────────────────────────────
  # Zap Frontend Storefront & Admin Panel
  # ─────────────────────────────────────────────────────────────
  zap-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://zap-api:3001}
    image: zap-frontend:latest
    container_name: zap_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_API_URL=${BACKEND_API_URL:-http://zap-api:3001}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - zap-network

networks:
  zap-network:
    name: zap-network
    driver: bridge
